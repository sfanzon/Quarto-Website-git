# Shared defaults for all portfolio explainers.
# Project pages use a custom in-page chapter navigator rather than Quarto's margin TOC.
# They are documentation only: expensive computation lives in the
# separate code repositories and figures are committed as static assets.
execute:
  enabled: false
  freeze: true

format:
  html:
    theme:
      light:
        - flatly
        - ../styles/main.scss
        - ../styles/project.scss
      dark:
        - darkly
        - ../styles/main.scss
        - ../styles/project.scss
    include-after-body:
      - ../includes/project-navigation.html

toc: false
page-layout: article
