name: Visual Regression Tests

# ── When ──────────────────────────────────────────────────────────
# Manual trigger or when styles/content/data/filters change in a PR.
# Does NOT run on every push — visual tests are expensive and should
# be intentional.
# ───────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'styles/**'
      - '_quarto.yml'
      - 'data/**'
      - 'filters/**'
      - 'scripts/**'
      - 'projects/**'
      - 'news/**'
      - '*.qmd'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-tests.yml'

jobs:
  visual:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Install deterministic fonts
        # Roboto is the first cross-platform fallback in the site's font stack
        # after the macOS/Windows-specific entries. Installing it ensures
        # consistent font rendering across CI runs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'

      - name: Guard — docs freshness check
        # Fail fast if committed docs/ is stale relative to source.
        # Renders the site and exits non-zero if docs/ would change.
        # Uses git status --porcelain to catch new/untracked files too.
        # docs/sitemap.xml <lastmod> timestamps are environment-dependent
        # (based on file mtime after checkout); only structural sitemap
        # changes (new/missing pages, different <loc>) trigger a failure.
        run: |
          quarto render 2>&1

          # If sitemap.xml changed, verify it is only timestamp drift
          if git status --porcelain -- docs/ | grep -q 'docs/sitemap.xml'; then
            if git diff docs/sitemap.xml | grep '^[+-]' | grep -v '^[+-][+-][+-]' | grep -v '<lastmod>' > /dev/null 2>&1; then
              echo ""
              echo "❌  FAIL: docs/sitemap.xml has structural changes."
              echo "   Run 'quarto render' and commit the regenerated sitemap."
              echo ""
              git status --short -- docs/
              exit 1
            fi
            # Only <lastmod> drifted — restore committed version
            git checkout HEAD -- docs/sitemap.xml
          fi

          # Check for any remaining stale output
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            echo ""
            echo "❌  FAIL: committed docs/ is stale."
            echo "   Run 'quarto render' and commit the generated output."
            echo ""
            git status --short -- docs/
            exit 1
          fi

          echo "✅  PASS: docs/ is fresh"

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 14
