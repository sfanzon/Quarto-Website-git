<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Safe agent-assisted implementation workflow</title>
  <desc id="desc">Seven connected stages from defining the objective through source inspection, implementation, testing, rendered inspection and final diff review.</desc>
  <rect width="1100" height="500" fill="none"/>
  <path d="M135 145H965M965 145V355H135" fill="none" stroke="#55778a" stroke-width="4" stroke-linecap="round" opacity=".35"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#f8f3eb" stroke="#55778a" stroke-width="3">
      <rect x="45" y="95" width="180" height="100" rx="18"/>
      <rect x="260" y="95" width="180" height="100" rx="18"/>
      <rect x="475" y="95" width="180" height="100" rx="18"/>
      <rect x="690" y="95" width="180" height="100" rx="18"/>
      <rect x="875" y="305" width="180" height="100" rx="18"/>
      <rect x="660" y="305" width="180" height="100" rx="18"/>
    </g>
    <rect x="445" y="305" width="180" height="100" rx="18" fill="#efe0d6" stroke="#a8522f" stroke-width="3"/>
    <g fill="#a8522f" font-size="16" font-weight="750">
      <text x="135" y="124">01</text><text x="350" y="124">02</text><text x="565" y="124">03</text>
      <text x="780" y="124">04</text><text x="965" y="334">05</text><text x="750" y="334">06</text><text x="535" y="334">07</text>
    </g>
    <g fill="#1c1c1d" font-size="18" font-weight="650">
      <text x="135" y="154">DEFINE</text><text x="135" y="178">OBJECTIVE</text>
      <text x="350" y="154">INSPECT</text><text x="350" y="178">SOURCE</text>
      <text x="565" y="154">PLAN THE</text><text x="565" y="178">CHANGE</text>
      <text x="780" y="154">IMPLEMENT</text><text x="780" y="178">COHERENTLY</text>
      <text x="965" y="364">FOCUSED</text><text x="965" y="388">TESTS</text>
      <text x="750" y="364">INSPECT</text><text x="750" y="388">OUTPUT</text>
      <text x="535" y="364">REVIEW</text><text x="535" y="388">FINAL DIFF</text>
    </g>
  </g>
</svg>
