<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Bounded agent orchestration</title>
  <desc id="desc">A primary agent delegates three independent audits, integrates the findings, and verifies the complete result.</desc>
  <rect width="1000" height="570" fill="none"/>
  <g fill="none" stroke="#55778a" stroke-width="4" stroke-linecap="round" opacity=".5">
    <path d="M500 110V160M500 160H190V220M500 160V220M500 160H810V220"/>
    <path d="M190 300V350H500M500 300V350M810 300V350H500M500 350V400M500 478V520"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="315" y="34" width="370" height="76" rx="20" fill="#a8522f"/>
    <text x="500" y="81" fill="#fffdf9" font-size="25" font-weight="700">PRIMARY AGENT</text>
    <g fill="#edf1f2" stroke="#55778a" stroke-width="3">
      <rect x="70" y="220" width="240" height="80" rx="18"/>
      <rect x="380" y="220" width="240" height="80" rx="18"/>
      <rect x="690" y="220" width="240" height="80" rx="18"/>
    </g>
    <g fill="#1c1c1d" font-size="20" font-weight="650">
      <text x="190" y="255">ARCHITECTURE</text><text x="190" y="280">AUDIT</text>
      <text x="500" y="255">TEST</text><text x="500" y="280">AUDIT</text>
      <text x="810" y="255">ACCESSIBILITY</text><text x="810" y="280">AUDIT</text>
    </g>
    <rect x="285" y="400" width="430" height="78" rx="20" fill="#efe0d6" stroke="#a8522f" stroke-width="3"/>
    <text x="500" y="448" fill="#1c1c1d" font-size="24" font-weight="700">INTEGRATE FINDINGS</text>
    <rect x="365" y="510" width="270" height="50" rx="15" fill="#55778a"/>
    <text x="500" y="542" fill="#fffdf9" font-size="19" font-weight="700">RENDER &amp; VERIFY</text>
  </g>
</svg>
