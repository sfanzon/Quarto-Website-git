<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Portable AI rule system</title>
  <desc id="desc">One canonical AI rules file branches into a core subset and task-specific presets for mathematics, coding, editing and long conversations.</desc>
  <rect width="1000" height="520" fill="none"/>
  <g fill="none" stroke="#55778a" stroke-width="4" stroke-linecap="round" opacity=".45">
    <path d="M500 130V205M500 205H135V285M500 205H315V285M500 205V285M500 205H685V285M500 205H865V285"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="325" y="42" width="350" height="88" rx="20" fill="#a8522f"/>
    <text x="500" y="80" fill="#fffdf9" font-size="25" font-weight="750">AI-RULES.md</text>
    <text x="500" y="108" fill="#fffdf9" font-size="16">canonical source of truth</text>
    <g fill="#edf1f2" stroke="#55778a" stroke-width="3">
      <rect x="55" y="285" width="160" height="100" rx="18"/>
      <rect x="235" y="285" width="160" height="100" rx="18"/>
      <rect x="415" y="285" width="170" height="100" rx="18"/>
      <rect x="605" y="285" width="160" height="100" rx="18"/>
      <rect x="785" y="285" width="160" height="100" rx="18"/>
    </g>
    <g fill="#1c1c1d" font-size="17" font-weight="680">
      <text x="135" y="329">CORE</text><text x="135" y="355" font-size="14" font-weight="500">global rules</text>
      <text x="315" y="329">MATHS</text><text x="315" y="355" font-size="14" font-weight="500">research</text>
      <text x="500" y="329">CODING</text><text x="500" y="355" font-size="14" font-weight="500">repositories</text>
      <text x="685" y="329">EDITING</text><text x="685" y="355" font-size="14" font-weight="500">documents</text>
      <text x="865" y="329">LONG CHATS</text><text x="865" y="355" font-size="14" font-weight="500">continuity</text>
