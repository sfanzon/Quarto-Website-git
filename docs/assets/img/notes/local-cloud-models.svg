<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Local and cloud execution decision</title>
  <desc id="desc">A decision tree comparing local execution for control and privacy with cloud execution for capability and maintained infrastructure.</desc>
  <rect width="1000" height="560" fill="none"/>
  <g fill="none" stroke="#55778a" stroke-width="4" stroke-linecap="round" opacity=".55">
    <path d="M500 116V168M500 168H265V218M500 168H735V218"/>
    <path d="M265 298V350M735 298V350"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="310" y="38" width="380" height="78" rx="20" fill="#a8522f"/>
    <text x="500" y="71" fill="#fffdf9" font-size="20" font-weight="650">WHAT DOES THE TASK REQUIRE?</text>
    <text x="500" y="96" fill="#fffdf9" font-size="17">privacy · capability · cost · control</text>
    <rect x="115" y="218" width="300" height="80" rx="20" fill="#edf1f2" stroke="#55778a" stroke-width="3"/>
    <text x="265" y="267" fill="#1c1c1d" font-size="28" font-weight="700">LOCAL</text>
    <rect x="585" y="218" width="300" height="80" rx="20" fill="#efe0d6" stroke="#a8522f" stroke-width="3"/>
    <text x="735" y="267" fill="#1c1c1d" font-size="28" font-weight="700">CLOUD</text>
    <g fill="#f8f3eb" stroke="#55778a" stroke-width="2">
      <rect x="90" y="350" width="350" height="54" rx="14"/>
      <rect x="90" y="418" width="350" height="54" rx="14"/>
      <rect x="90" y="486" width="350" height="54" rx="14"/>
    </g>
    <g fill="#1c1c1d" font-size="18">
      <text x="265" y="383">direct repository control</text>
      <text x="265" y="451">privacy and offline work</text>
      <text x="265" y="519">hardware-dependent capability</text>
    </g>
    <g fill="#f8f3eb" stroke="#a8522f" stroke-width="2">
      <rect x="560" y="350" width="350" height="54" rx="14"/>
      <rect x="560" y="418" width="350" height="54" rx="14"/>
      <rect x="560" y="486" width="350" height="54" rx="14"/>
    </g>
    <g fill="#1c1c1d" font-size="18">
      <text x="735" y="383">strong maintained models</text>
      <text x="735" y="451">large context and services</text>
      <text x="735" y="519">network and data trade-offs</text>
    </g>
  </g>
</svg>
