<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Controlling scope in AI-assisted work</title>
  <desc id="desc">A bounded path from problem to verified fix contrasted with an expanding path of cleanup, refactoring and complexity.</desc>
  <rect width="1000" height="500" fill="none"/>
  <g font-family="system-ui, sans-serif">
    <text x="70" y="88" fill="#a8522f" font-size="18" font-weight="750">BOUNDED WORK</text>
    <text x="70" y="315" fill="#55778a" font-size="18" font-weight="750">SCOPE CREEP</text>
  </g>
  <path d="M105 170H760" fill="none" stroke="#a8522f" stroke-width="6" stroke-linecap="round"/>
  <path d="M105 395C255 395 290 362 405 362C545 362 555 287 700 287C790 287 838 235 910 178"
        fill="none" stroke="#55778a" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" font-size="17" font-weight="650">
    <g fill="#f8f3eb" stroke="#a8522f" stroke-width="3">
      <rect x="55" y="130" width="150" height="80" rx="16"/><rect x="255" y="130" width="150" height="80" rx="16"/>
      <rect x="455" y="130" width="150" height="80" rx="16"/><rect x="655" y="130" width="150" height="80" rx="16"/>
    </g>
    <g fill="#1c1c1d">
      <text x="130" y="176">PROBLEM</text><text x="330" y="176">DIAGNOSIS</text>
      <text x="530" y="176">SMALL FIX</text><text x="730" y="176">VERIFY</text>
    </g>
    <g fill="#edf1f2" stroke="#55778a" stroke-width="2">
      <rect x="55" y="355" width="150" height="80" rx="16"/><rect x="255" y="322" width="150" height="80" rx="16"/>
      <rect x="455" y="247" width="150" height="80" rx="16"/><rect x="655" y="197" width="150" height="80" rx="16"/>
      <rect x="820" y="117" width="130" height="80" rx="16"/>
    </g>
    <g fill="#1c1c1d" font-size="15">
      <text x="130" y="401">FIX</text><text x="330" y="368">CLEANUP</text><text x="530" y="293">REFACTOR</text>
      <text x="730" y="243">NEW API</text><text x="885" y="163">NEW SYSTEM</text>
    </g>
  </g>
</svg>
