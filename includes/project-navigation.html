<!-- Reusable project chapter navigation.
     Desktop: permanent left rail.
     Narrow screens: drawer with an attached pull tab.
     Add body class `project-nav-secondary-bar` for a full-width secondary bar,
     useful for long lecture notes. -->
<script>
(function () {
  const MOBILE_BREAKPOINT = 1200;
  const FULL_BAR_HEIGHT = 46;

  function headingText(heading) {
    const clone = heading.cloneNode(true);
    clone.querySelectorAll(
      '.anchorjs-link, .header-section-number, .project-section-number'
    ).forEach(function (node) {
      node.remove();
    });
    return clone.textContent.replace(/\s+/g, ' ').trim();
  }

  function initProjectChapterNavigation() {
    if (!document.body.classList.contains('project-detail-page')) return;
    if (document.querySelector('[data-project-chapter-rail]')) return;

    const entries = Array.from(document.querySelectorAll('main.content h2'))
      .map(function (heading) {
        const fullLabel = headingText(heading);
        const shortLabel = (heading.getAttribute('data-nav-title') || fullLabel).trim();
        const section = heading.closest('section.level2[id]');
        const id = (section && section.id) || heading.id || heading.getAttribute('data-anchor-id');
        const target = section || heading;
        const isUnnumbered =
          heading.classList.contains('unnumbered') ||
          target.classList.contains('unnumbered');
        return {
          heading: heading,
          section: target,
          id: id,
          fullLabel: fullLabel,
          shortLabel: shortLabel,
          isUnnumbered: isUnnumbered,
          number: ''
        };
      })
      .filter(function (entry) {
        if (!entry.id || !entry.fullLabel) return false;
        if (/^(show|hide)\b.*\bcode\b/i.test(entry.fullLabel)) return false;
        if (
          entry.heading.hasAttribute('data-nav-exclude') ||
          entry.section.hasAttribute('data-nav-exclude')
        ) {
          return false;
        }
        return !entry.heading.closest(
          'details, .cell, .code-fold, .sourceCode, #quarto-margin-sidebar'
        );
      });

    if (entries.length < 2) return;

    let numberedIndex = 0;
    entries.forEach(function (entry) {
      if (!entry.isUnnumbered) {
        numberedIndex += 1;
        entry.number = String(numberedIndex);
      }
    });

    entries.forEach(function (entry) {
      if (entry.isUnnumbered) return;
      if (entry.heading.querySelector('.project-section-number')) return;
      const number = document.createElement('span');
      number.className = 'project-section-number';
      number.textContent = entry.number;
      number.setAttribute('aria-hidden', 'true');
      entry.heading.insertBefore(number, entry.heading.firstChild);
    });

    const nav = document.createElement('nav');
    nav.id = 'project-chapter-navigation';
    nav.className = 'project-chapter-rail';
    nav.setAttribute('data-project-chapter-rail', '');
    nav.setAttribute('aria-label', 'Project sections');

    const list = document.createElement('ol');
    const links = entries.map(function (entry) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      const numberSpan = document.createElement('span');
      const labelSpan = document.createElement('span');

      link.href = '#' + entry.id;
      link.title = entry.fullLabel;
      link.setAttribute(
        'aria-label',
        entry.isUnnumbered
          ? entry.fullLabel
          : entry.number + '. ' + entry.fullLabel
      );

      numberSpan.className =
        'project-chapter-number' + (entry.isUnnumbered ? ' is-empty' : '');
      numberSpan.textContent = entry.number;
      numberSpan.setAttribute('aria-hidden', 'true');

      labelSpan.className = 'project-chapter-label';
      labelSpan.textContent = entry.shortLabel;

      link.appendChild(numberSpan);
      link.appendChild(labelSpan);
      item.appendChild(link);
      list.appendChild(item);
      return link;
    });

    const scrollRegion = document.createElement('div');
    scrollRegion.className = 'project-chapter-scroll';
    scrollRegion.appendChild(list);
    nav.appendChild(scrollRegion);

    const toggle = document.createElement('button');
    toggle.className = 'project-chapter-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-controls', nav.id);
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open project navigation');
    toggle.innerHTML =
      '<i class="bi bi-chevron-right" aria-hidden="true"></i>';
    nav.appendChild(toggle);

    const currentLabel = document.createElement('span');
    currentLabel.className = 'project-secondary-nav-label';
    currentLabel.setAttribute('aria-live', 'polite');
    nav.appendChild(currentLabel);

    document.body.appendChild(nav);

    const backdrop = document.createElement('div');
    backdrop.className = 'project-chapter-backdrop';
    backdrop.setAttribute('aria-hidden', 'true');
    document.body.appendChild(backdrop);

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const desktopQuery = window.matchMedia(
      '(min-width: ' + MOBILE_BREAKPOINT + 'px)'
    );

    function navbarHeight() {
      const nodes = [
        document.querySelector('#quarto-header'),
        document.querySelector('.navbar'),
        document.querySelector('.navbar-collapse.show')
      ].filter(Boolean);
      if (!nodes.length) return 64;
      return Math.ceil(
        Math.max.apply(
          null,
          nodes.map(function (node) {
            const rect = node.getBoundingClientRect();
            return Math.max(rect.height, rect.bottom);
          })
        )
      );
    }

    function secondaryNavigationHeight() {
      return document.body.classList.contains('project-nav-secondary-bar')
        ? FULL_BAR_HEIGHT
        : 0;
    }

    function updateNavigationGeometry() {
      const height = navbarHeight();
      const secondaryHeight = secondaryNavigationHeight();
      document.documentElement.style.setProperty(
        '--project-navbar-height',
        height + 'px'
      );
      document.documentElement.style.setProperty(
        '--project-secondary-height',
        FULL_BAR_HEIGHT + 'px'
      );
      document.documentElement.style.setProperty(
        '--project-navigation-stack-height',
        (height + secondaryHeight) + 'px'
      );
    }

    function closeDrawer(restoreFocus) {
      if (!document.body.classList.contains('project-nav-open')) return;
      document.body.classList.remove('project-nav-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open project navigation');
      if (restoreFocus) toggle.focus();
    }

    function openDrawer() {
      if (desktopQuery.matches) return;
      document.body.classList.add('project-nav-open');
      toggle.setAttribute('aria-expanded', 'true');
      toggle.setAttribute('aria-label', 'Close project navigation');
    }

    function setActive(index) {
      links.forEach(function (link, linkIndex) {
        const active = linkIndex === index;
        link.classList.toggle('is-active', active);
        if (active) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      });
      currentLabel.textContent = entries[index].shortLabel;
      toggle.title = 'Sections · ' + entries[index].shortLabel;
    }

    function scrollOffset() {
      return desktopQuery.matches
        ? navbarHeight() + 22
        : navbarHeight() + secondaryNavigationHeight() + 16;
    }

    function scrollToEntry(entry, index, updateHash) {
      const top = Math.max(
        0,
        entry.section.getBoundingClientRect().top + window.scrollY - scrollOffset()
      );
      window.scrollTo({
        top: top,
        behavior: reducedMotion.matches ? 'auto' : 'smooth'
      });
      setActive(index);
      if (updateHash && window.history && window.history.pushState) {
        window.history.pushState(null, '', '#' + entry.id);
      }
    }

    links.forEach(function (link, index) {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        closeDrawer(false);
        window.requestAnimationFrame(function () {
          scrollToEntry(entries[index], index, true);
        });
      });
    });

    toggle.addEventListener('click', function () {
      if (document.body.classList.contains('project-nav-open')) {
        closeDrawer(false);
      } else {
        openDrawer();
      }
    });

    backdrop.addEventListener('click', function () {
      closeDrawer(true);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeDrawer(true);
    });

    desktopQuery.addEventListener('change', function (event) {
      updateNavigationGeometry();
      if (event.matches) closeDrawer(false);
    });

    let edgeTouch = null;
    let drawerTouch = null;

    document.addEventListener('touchstart', function (event) {
      if (desktopQuery.matches || document.body.classList.contains('project-nav-open')) return;
      const touch = event.touches[0];
      if (touch && touch.clientX <= 24) {
        edgeTouch = { x: touch.clientX, y: touch.clientY };
      }
    }, { passive: true });

    document.addEventListener('touchend', function (event) {
      if (!edgeTouch || desktopQuery.matches) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - edgeTouch.x;
      const dy = Math.abs(touch.clientY - edgeTouch.y);
      edgeTouch = null;
      if (dx >= 58 && dy <= 70) openDrawer();
    }, { passive: true });

    nav.addEventListener('touchstart', function (event) {
      if (!document.body.classList.contains('project-nav-open')) return;
      const touch = event.touches[0];
      if (touch) drawerTouch = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    nav.addEventListener('touchend', function (event) {
      if (!drawerTouch) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - drawerTouch.x;
      const dy = Math.abs(touch.clientY - drawerTouch.y);
      drawerTouch = null;
      if (dx <= -58 && dy <= 70) closeDrawer(false);
    }, { passive: true });

    let scheduled = false;
    function updateActiveSection() {
      scheduled = false;
      const marker =
        window.scrollY + scrollOffset() + Math.min(150, window.innerHeight * 0.18);
      let activeIndex = 0;
      entries.forEach(function (entry, index) {
        if (
          entry.section.getBoundingClientRect().top + window.scrollY <= marker
        ) {
          activeIndex = index;
        }
      });
      setActive(activeIndex);
    }

    function requestUpdate() {
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(updateActiveSection);
    }


    const geometryNodes = [
      document.querySelector('#quarto-header'),
      document.querySelector('.navbar'),
      document.querySelector('.navbar-collapse')
    ].filter(Boolean);

    if ('ResizeObserver' in window) {
      const navigationResizeObserver = new ResizeObserver(function () {
        updateNavigationGeometry();
        requestUpdate();
      });
      geometryNodes.forEach(function (node) {
        navigationResizeObserver.observe(node);
      });
    }

    const navbarCollapse = document.querySelector('.navbar-collapse');
    if (navbarCollapse && 'MutationObserver' in window) {
      const navigationMutationObserver = new MutationObserver(function () {
        window.requestAnimationFrame(function () {
          updateNavigationGeometry();
          requestUpdate();
        });
      });
      navigationMutationObserver.observe(navbarCollapse, {
        attributes: true,
        attributeFilter: ['class', 'style']
      });
    }

    ['show.bs.collapse', 'shown.bs.collapse', 'hide.bs.collapse', 'hidden.bs.collapse']
      .forEach(function (eventName) {
        document.addEventListener(eventName, function () {
          window.setTimeout(function () {
            updateNavigationGeometry();
            requestUpdate();
          }, 0);
        });
      });

    const relatedSection = document.querySelector('.project-related');
    if (relatedSection && 'IntersectionObserver' in window) {
      const relatedObserver = new IntersectionObserver(function (entries) {
        const visible = entries.some(function (entry) {
          return entry.isIntersecting;
        });
        document.body.classList.toggle('project-related-in-view', visible);
      }, {
        root: null,
        rootMargin: '0px 0px -28% 0px',
        threshold: 0
      });
      relatedObserver.observe(relatedSection);
    }

    updateNavigationGeometry();
    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', function () {
      updateNavigationGeometry();
      requestUpdate();
    });
    window.addEventListener('hashchange', requestUpdate);

    if (window.location.hash) {
      const initialId = decodeURIComponent(window.location.hash.slice(1));
      const initialIndex = entries.findIndex(function (entry) {
        return entry.id === initialId;
      });
      if (initialIndex >= 0) {
        window.setTimeout(function () {
          scrollToEntry(entries[initialIndex], initialIndex, false);
        }, 0);
      }
    }

    updateActiveSection();
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      initProjectChapterNavigation
    );
  } else {
    initProjectChapterNavigation();
  }
})();
</script>
